<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat Body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#FF6B35" stroke="#E55A2B" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="80" r="35" fill="#FF6B35" stroke="#E55A2B" stroke-width="2"/>

  <!-- Cat Ears -->
  <path d="M75 60 L85 40 L95 60 Z" fill="#FF6B35" stroke="#E55A2B" stroke-width="2"/>
  <path d="M105 60 L115 40 L125 60 Z" fill="#FF6B35" stroke="#E55A2B" stroke-width="2"/>

  <!-- Inner Ears -->
  <path d="M79 58 L85 45 L91 58 Z" fill="#FFB3A3"/>
  <path d="M109 58 L115 45 L121 58 Z" fill="#FFB3A3"/>

  <!-- Cat Eyes -->
  <ellipse cx="90" cy="75" rx="8" ry="12" fill="#333"/>
  <ellipse cx="110" cy="75" rx="8" ry="12" fill="#333"/>

  <!-- Eye Highlights -->
  <ellipse cx="92" cy="72" rx="3" ry="4" fill="#FFF"/>
  <ellipse cx="112" cy="72" rx="3" ry="4" fill="#FFF"/>

  <!-- Cat Nose -->
  <path d="M97 85 L100 90 L103 85 Z" fill="#FF1744"/>

  <!-- Cat Mouth -->
  <path d="M100 90 Q95 95 90 90" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M100 90 Q105 95 110 90" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Cat Whiskers -->
  <line x1="70" y1="82" x2="85" y2="80" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="88" x2="85" y2="88" stroke="#333" stroke-width="2"/>
  <line x1="115" y1="80" x2="130" y2="82" stroke="#333" stroke-width="2"/>
  <line x1="115" y1="88" x2="130" y2="88" stroke="#333" stroke-width="2"/>

  <!-- Cat Tail -->
  <path d="M140 120 Q160 100 165 80 Q170 60 160 45" stroke="#FF6B35" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Cat Legs -->
  <ellipse cx="80" cy="160" rx="8" ry="20" fill="#FF6B35" stroke="#E55A2B" stroke-width="2"/>
  <ellipse cx="100" cy="160" rx="8" ry="20" fill="#FF6B35" stroke="#E55A2B" stroke-width="2"/>
  <ellipse cx="120" cy="160" rx="8" ry="20" fill="#FF6B35" stroke="#E55A2B" stroke-width="2"/>

  <!-- Cat Paws -->
  <circle cx="80" cy="175" r="6" fill="#333"/>
  <circle cx="100" cy="175" r="6" fill="#333"/>
  <circle cx="120" cy="175" r="6" fill="#333"/>

  <!-- Chest Pattern -->
  <ellipse cx="100" cy="110" rx="15" ry="10" fill="#FFB3A3"/>
</svg>